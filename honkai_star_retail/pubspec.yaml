name: honkai_star_retail
description: "A hybrid mobile solution for Honkai Star Retail project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0 

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.1.0
  provider: ^6.1.1
  google_sign_in: ^6.2.1
  shared_preferences: ^2.2.2
  intl: ^0.18.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # --- PERBAIKAN DI SINI ---
  # Hapus tanda pagar (#) dan pastikan spasi/indentasi tepat
  assets:
    - assets/images/logo_retail.png
    - assets/images/google_logo.png
